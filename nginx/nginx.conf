# it tells nginx to automatically determine the optimal number of worker processes based on available CPU cores, ensuring efficient resource utilization and improved performance.
worker_processes auto;

# It ensure that each worker process can handle a maximum of 1024 simultaneous connections, allowing the server to efficiently manage multiple client requests concurrently.
events {
    worker_connections 1024;

    # Accept multiple connections at once
    multi_accept on;

}

# The http block contains the main configuration for handling HTTP requests, including MIME types, compression settings, rate limiting, and upstream server definitions.
http {
    # Loads file extension to MIME type mappings so browsers know how to correctly handle files like HTML, CSS, JS, PNG, JSON, etc.
    include /etc/nginx/mime.types;

    # Sets a fallback content type for unknown file extensions, usually forcing the browser to download the file safely as binary data.
    default_type application/octet-stream;

     # Enables the use of sendfile() system call for efficient file transfers, reducing CPU usage and improving response times when serving static files.
    sendfile on;

    # Sets the maximum time a connection can remain idle before being closed, helping to free up resources for new incoming requests.
    keepalive_timeout 65s;

    # Sets the maximum time NGINX waits for the client to send the request body, preventing slow clients from holding connections open indefinitely.
    client_body_timeout 15s;

    # How long NGINX waits for the client to send request headers.
    client_header_timeout 15s;

    # Enables gzip compression for responses, reducing bandwidth usage and improving load times for clients that support it. using it, nginx will compress responses before sending them to clients, which can significantly reduce the amount of data transmitted over the network, especially for text-based content like HTML, CSS, and JavaScript.
    gzip on;

    # set gzip compression level (1-9, where 5 is a good balance between compression and CPU usage)
    gzip_comp_level 5;

    # Only compress responses larger than 256 bytes
    gzip_min_length 256;

    # Without it, a cache might incorrectly serve a gzip-compressed response to a browser that does not support gzip.
    gzip_vary on;

    # Specifies the MIME types that should be compressed using gzip, ensuring that text-based content is efficiently transmitted to clients.
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # Edge Rate Limiting (30 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=global_edge_limit:10m rate=30r/s;

    # Nginx Proxy Cache Path definitions:
    # - keys_zone: name and size of the shared memory zone (holds cache keys/metadata)
    # - levels: subdirectory level structure (e.g. 1:2 creates two-tier subdirectories)
    # - max_size: maximum space the cache can use on disk
    # - inactive: how long cached files remain without being accessed before deletion
    # - use_temp_path: off to write directly to cache directory and avoid copying files
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=wsms_cache:10m max_size=1g inactive=60m use_temp_path=off;


    # Maximum upload size (Supports 25MB audio + 10MB document uploads)
    client_max_body_size 30M;

    # Upstream definitions for backend and frontend servers. These define the backend services that NGINX will proxy requests to, allowing for load balancing and failover.
    upstream wsms_frontend {
        server host.docker.internal:3001;
    }

    # Upstream definition for backend servers with load balancing and failover settings. It specifies multiple backend servers that NGINX can proxy requests to, with settings for maximum failures and failover timeouts.
    upstream wsms_backend {
        # Load balancing method: least_conn (least connections) - directs traffic to the server with the fewest active connections, helping to distribute load evenly across backend servers.
        least_conn;

        server host.docker.internal:6001 max_fails=3 fail_timeout=10s;
        server host.docker.internal:6002 max_fails=3 fail_timeout=10s;
        server host.docker.internal:6003 max_fails=3 fail_timeout=10s;
    }

    # Redirect all HTTP requests to HTTPS without changing their paths.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }


    # ==========================================================================
    # 4. HTTPS MAIN SERVER (PORT 443)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name localhost; # Replace with your production domain

        # Serve the localhost certificate and its matching private key from nginx/ssl.
        ssl_certificate     /etc/nginx/ssl/localhost.crt;
        ssl_certificate_key /etc/nginx/ssl/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Production Security Headers
        # Prevents your website from being embedded inside an HTML frame or iframe on another website. clickjacking.
        add_header X-Frame-Options "DENY" always;
        # Prevents browsers from guessing a resource's content type instead of respecting the server's declared Content-Type.
        add_header X-Content-Type-Options "nosniff" always;
        # Activates an older browser's built-in cross-site scripting (XSS) filter, where supported.
        add_header X-XSS-Protection "1; mode=block" always;
        # Tells browsers to use HTTPS for future requests to your website for a specified period.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Global Proxy Headers (Matches app.set("trust proxy", 1) in app.ts)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # It will store the state of the rate limiting in a shared memory zone called global_edge_limit, which can hold up to 10MB of data. The rate limit is set to 30 requests per second per IP address. If a client exceeds this limit, they will receive a "429 Too Many Requests" response.
        limit_req zone=global_edge_limit burst=50 nodelay;

        # ----------------------------------------------------------------------
        # ROUTE A: AI Response Streaming (/api/ai/stream)
        # ----------------------------------------------------------------------
        location ^~ /api/ai/stream {
            proxy_pass http://wsms_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';

            # Repeat proxy headers here because this location overrides Connection.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering so LLM tokens stream to frontend immediately
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 300s;
        }

        # ----------------------------------------------------------------------
        # ROUTE B: Express Backend API (/api/, /auth/, /verify/, /check-username)
        # ----------------------------------------------------------------------
        location ~ ^/(api|auth|verify|check-username)(/|$) {
            proxy_pass http://wsms_backend;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ----------------------------------------------------------------------
        # ROUTE C: Next.js Frontend (All remaining routes)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://wsms_frontend;
        }
    }
}
