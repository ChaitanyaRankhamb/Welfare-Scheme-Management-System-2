name: Node.js CI

# run the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # allow manual triggering of the workflow

# set permissions for the workflow
permissions:
  contents: read

# define concurrency settings to prevent multiple runs of the same workflow for the same branch 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# define the jobs for the workflow
jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node-version }}) # job name with node.js version
    runs-on: ubuntu-latest # jobs run on this environment
    timeout-minutes: 20 # maximum time for the job to run before being cancelled
    strategy: # define a strategy for the job, including matrix builds
      fail-fast: false
      matrix:
        node-version: ["22.x"]

    steps:
      - uses: actions/checkout@v4 # Downloads your repository's source code into the GitHub Actions runner's workspace.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies 
        run: npm ci # install dependencies based on package-Lock.json
        working-directory: apps/frontend # set the working directory to the frontend app

      - name: Lint
        run: npm run lint # lint the frontend codebase
        working-directory: apps/frontend

      - name: Build
        run: npm run build # build the frontend application
        working-directory: apps/frontend

  backend:
    name: Backend (Node ${{ matrix.node-version }}) # job name with node.js version
    runs-on: ubuntu-latest # jobs run on this environment
    timeout-minutes: 20 # maximum time for the job to run before being cancelled
    strategy: # define a strategy for the job, including matrix builds
      fail-fast: false
      matrix:
        node-version: ["22.x"]

    steps:
      - uses: actions/checkout@v4 # Downloads your repository's source code into the GitHub Actions runner's workspace.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci # install dependencies based on package-Lock.json
        working-directory: apps/backend

      - name: Lint
        run: npm run lint # lint the backend codebase
        working-directory: apps/backend

      - name: Build
        run: npm run build # build the backend application
        working-directory: apps/backend