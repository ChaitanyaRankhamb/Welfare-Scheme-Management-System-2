name: Docker Image CI

# Trigger this workflow after the first workflow ("Node.js CI") completes successfully
on:
  workflow_run:
    workflows: ["Node.js CI"]
    types:
      - completed
    branches:
      - main # only run this workflow for the main branch
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

# Set permissions for the workflow
permissions:
  contents: read
  packages: write # allow writing to GitHub Packages (for pushing Docker images)

# Define concurrency settings to prevent multiple runs of the same workflow for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # cancel any in-progress runs of this workflow for the same branch when a new run is triggered

# Define the jobs for the workflow
jobs:
  build-backend-image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    # Only execute if the previous workflow succeeded (or triggered manually)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 20 # maximum time for the job to run before being cancelled

    steps:
      # Downloads your repository's source code into the GitHub Actions runner's workspace.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Set up Docker Buildx to build multi-platform Docker images. Buildx is a Docker CLI plugin that extends the docker command with the full support of the features provided by Moby BuildKit builder toolkit.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the backend Docker image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true # allow to push the image to a registry
          tags: |
            ghcr.io/chaitanyarankhamb/wsms-backend:sha-${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/chaitanyarankhamb/wsms-backend:latest
          cache-from: type=gha # use GitHub Actions cache for build cache to speed up subsequent builds
          cache-to: type=gha,mode=max # use GitHub Actions cache for build cache to speed up subsequent builds, with maximum caching mode

  build-frontend-image:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    # Only execute if the previous workflow succeeded (or triggered manually)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 25 # maximum time for the job to run before being cancelled

    steps:
      # Downloads your repository's source code into the GitHub Actions runner's workspace.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Set up Docker Buildx to build multi-platform Docker images. Buildx is a Docker CLI plugin that extends the docker command with the full support of the features provided by Moby BuildKit builder toolkit.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry (GHCR) - each job runs on an isolated runner, so login is required here too
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the frontend Docker image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_AUTH_API_URL=https://localhost
          push: true # allow to push the image to a registry
          tags: |
            ghcr.io/chaitanyarankhamb/wsms-frontend:sha-${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/chaitanyarankhamb/wsms-frontend:latest
          cache-from: type=gha # use GitHub Actions cache for build cache to speed up subsequent builds
          cache-to: type=gha,mode=max # use GitHub Actions cache for build cache to speed up subsequent builds, with maximum caching mode
